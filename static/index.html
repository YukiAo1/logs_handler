<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸿蒙日志分析工具</title>
<link rel="stylesheet" href="/static/css/dark.css">
</head>
<body>

<div id="app">
  <header id="toolbar">
    <span class="logo">🔍 鸿蒙日志分析工具</span>
    <div class="toolbar-actions">
      <button class="btn btn-primary" onclick="Files.showFilePicker()">📂 选择文件</button>
      <button class="btn" onclick="Files.unloadAll()" title="卸载全部文件">🗑 卸载</button>
      <input type="file" id="filePickerInput" multiple accept=".log,.txt" style="display:none" onchange="Files.handleFilePick(event)">
      <input type="file" id="folderPickerInput" webkitdirectory multiple accept=".log,.txt" style="display:none" onchange="Files.handleFilePick(event)">
    </div>
  </header>

  <div id="mainLayout">
    <aside id="rulePanel">
      <div class="panel-header">
        <h3>筛选规则</h3>
      </div>
      <div class="panel-body" id="ruleList">
        <p class="placeholder">暂无规则，点击下方按钮新建</p>
      </div>
      <div class="panel-footer">
        <button class="btn btn-primary" onclick="Rules.showCreateDialog()">+ 新建</button>
        <button class="btn" onclick="Rules.exportRules()" title="导出规则为 JSON">📤 导出</button>
        <button class="btn" onclick="Rules.showImportDialog()" title="从 JSON 导入规则">📥 导入</button>
      </div>
    </aside>

    <main id="content">
      <div id="welcome">
        <div class="drop-zone" id="dropZone">
          <h2>📂 拖拽日志文件或文件夹到此处</h2>
          <p>支持 .log / .txt 格式，可同时加载多个文件</p>
          <button class="btn btn-primary" onclick="Files.showFilePicker()" style="margin-top:12px">选择文件</button>
        </div>
        <div class="file-list" id="fileList"></div>
      </div>
      <div id="searchResult" style="display:none">
        <div class="result-stats" id="resultStats"></div>
        <div class="table-wrapper">
          <table id="logTable">
            <thead>
              <tr>
                <th class="col-no">行号</th>
                <th class="col-date">日期</th>
                <th class="col-time">时间</th>
                <th class="col-level">级别</th>
                <th class="col-pid">PID</th>
                <th class="col-tid">TID</th>
                <th class="col-tag">Tag</th>
                <th class="col-msg">消息</th>
              </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <div id="statusBar">
    <span id="statusText">就绪</span>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/rules.js"></script>
<script src="/static/js/files.js"></script>
</body>
</html>
